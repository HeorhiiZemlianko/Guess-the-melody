<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Battle — Угадай мелодию</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Современные иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Шрифт для современного вида -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Верхняя панель: счёт, таймер, прогресс -->
        <header class="game-header">
            <div class="score">Счёт: <span id="scoreValue">0</span></div>
            <div class="timer">Время: <span id="timerValue">30</span>с</div>
            <div class="progress-bar"><div id="progressFill"></div></div>
            <div class="source-link">
                <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-youtube"></i> Источник: YouTube
                </a>
            </div>
        </header>

        <!-- Область для видео/аудио -->
        <main id="viewContent">
            <div class="video-overlay"></div>
        </main>

        <!-- Блок с вариантами ответов -->
        <div id="ButtonsBlock"></div>

        <!-- Финальный экран (появится после игры) -->
        <div id="finalScreen" class="hidden">
            <h2>Игра завершена!</h2>
            <p>Вы угадали <span id="finalScore">0</span> из 10</p>
            <p id="finalRating" style="font-size: 1.2rem; color: #4ecdc4; margin-top: -10px;"></p>
            <button id="restartButton">Играть снова</button>
        </div>
    </div>
    <script src="main.js" type="text/javascript"></script>
</body>
</html>
