<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Battle — Угадай мелодию</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-music"></i>
                <span>Music<em>Battle</em></span>
            </div>

            <div class="hud" id="hud">
                <div class="hud-item">
                    <i class="fa-solid fa-star"></i>
                    <span class="hud-label">Очки</span>
                    <span id="scoreValue" class="hud-value">0</span>
                </div>
                <div class="hud-item" id="streakHud">
                    <i class="fa-solid fa-fire"></i>
                    <span class="hud-label">Серия</span>
                    <span id="streakValue" class="hud-value">0</span>
                </div>
                <div class="hud-item">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span class="hud-label">Время</span>
                    <span id="timerValue" class="hud-value">60</span>
                </div>
                <div class="hud-item">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <span class="hud-label">Раунд</span>
                    <span id="roundValue" class="hud-value">0/0</span>
                </div>
                <div class="progress-bar"><div id="progressFill"></div></div>
            </div>

            <button id="exitButton" class="exit-button hidden" title="Вернуться в меню">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Выйти</span>
            </button>
        </header>

        <!-- ===== MAIN ===== -->
        <main class="app-main">
            <section id="viewContent" class="video-stage">
                <div class="video-overlay"></div>
            </section>

            <!-- Всплывающие очки -->
            <div id="pointsPopup" class="points-popup"></div>

            <!-- Показ исполнителя (подсказка) -->
            <div id="artistHint" class="artist-hint hidden"></div>

            <!-- Подсказки -->
            <section id="hintsRow" class="hints-row hidden">
                <button class="hint-btn" data-hint="remove2" title="Убрать 2 неправильных ответа">
                    <i class="fa-solid fa-scissors"></i>
                    <span>Убрать 2</span>
                    <em>−100</em>
                </button>
                <button class="hint-btn" data-hint="artist" title="Показать исполнителя">
                    <i class="fa-solid fa-microphone-lines"></i>
                    <span>Исполнитель</span>
                    <em>−150</em>
                </button>
                <button class="hint-btn" data-hint="time" title="Добавить 15 секунд">
                    <i class="fa-solid fa-clock"></i>
                    <span>+15 сек</span>
                    <em>−75</em>
                </button>
                <button class="hint-btn" data-hint="skip" title="Пропустить трек">
                    <i class="fa-solid fa-forward"></i>
                    <span>Пропустить</span>
                    <em>−200</em>
                </button>
            </section>

            <section id="ButtonsBlock" class="answers"></section>

            <!-- Стартовый экран с выбором сложности -->
            <div id="startScreen" class="start-screen">
                <div class="start-card start-card--wide">
                    <h1>Угадай <span>мелодию</span></h1>
                    <p>Выбери уровень сложности и покажи свой музыкальный вкус!</p>

                    <div class="high-score-badge hidden" id="highScoreBadge">
                        <i class="fa-solid fa-crown"></i>
                        Рекорд: <strong id="highScoreValue">0</strong>
                        <span id="highScoreDiff"></span>
                    </div>

                    <div class="difficulty-grid">
                        <button class="difficulty-card" data-difficulty="easy">
                            <i class="fa-solid fa-leaf"></i>
                            <h3>Лёгкий</h3>
                            <ul>
                                <li>4 варианта ответа</li>
                                <li>60 секунд на трек</li>
                                <li>10 раундов · ×1 очки</li>
                            </ul>
                        </button>

                        <button class="difficulty-card" data-difficulty="medium">
                            <i class="fa-solid fa-fire"></i>
                            <h3>Средний</h3>
                            <ul>
                                <li>4 варианта ответа</li>
                                <li>30 секунд на трек</li>
                                <li>15 раундов · ×1.25 очки</li>
                            </ul>
                        </button>

                        <button class="difficulty-card" data-difficulty="hard">
                            <i class="fa-solid fa-skull"></i>
                            <h3>Сложный</h3>
                            <ul>
                                <li>6 вариантов ответа</li>
                                <li>15 секунд на трек</li>
                                <li>20 раундов · ×1.5 очки</li>
                            </ul>
                        </button>

                        <button class="difficulty-card" data-difficulty="hardcore">
                            <i class="fa-solid fa-crown"></i>
                            <h3>Хардкор</h3>
                            <ul>
                                <li>Ввод названия вручную</li>
                                <li>60 секунд на трек</li>
                                <li>10 раундов · ×2 очки</li>
                            </ul>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Финальный экран -->
            <div id="finalScreen" class="final-screen hidden">
                <div class="final-card">
                    <h2>Игра завершена!</h2>
                    <p class="final-difficulty">Сложность: <span id="finalDifficulty">—</span></p>
                    <p class="final-score">
                        Угадано: <strong><span id="finalGuessed">0</span>/<span id="finalTotal">10</span></strong>
                    </p>
                    <p class="final-points">
                        <i class="fa-solid fa-star"></i> Очки: <strong id="finalScore">0</strong>
                    </p>
                    <p class="final-best-streak">🔥 Лучшая серия: <span id="finalBestStreak">0</span></p>
                    <p id="finalRating" class="final-rating"></p>
                    <p class="final-record hidden" id="newRecordBadge">🏆 Новый рекорд!</p>
                    <div class="final-actions">
                        <button id="restartButton" class="btn btn-primary">
                            <i class="fa-solid fa-rotate-right"></i> Играть снова
                        </button>
                        <button id="menuButton" class="btn btn-ghost">
                            <i class="fa-solid fa-house"></i> В меню
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="app-footer">
            <div class="footer-left">
                <span>© 2025 Music Battle</span>
                <span class="dot">•</span>
                <span>Музыкальная игра-викторина</span>
            </div>
            <div class="footer-right">
                <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
                    <i class="fa-brands fa-youtube"></i> Видео: YouTube
                </a>
                <a href="https://github.com/HeorhiiZemlianko/HeorhiiZemlianko" target="_blank" rel="noopener noreferrer">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </footer>
    </div>

    <script src="main.js" type="text/javascript"></script>
</body>
</html>
